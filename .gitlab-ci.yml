################
# GitLab CI for e-računi, on the Drupal Association's templates.
#
# The templates are kept up to date centrally; see
# https://project.pages.drupalcode.org/gitlab_templates/ for every variable.
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # Drupal 11 and 12: the previous minor too, and the next major before it is
  # released.
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  # Opting in only offers the variants as manual jobs; run them on every push
  # and merge request.
  _AUTORUN_PREVIOUS_MINOR: 'all'
  _AUTORUN_NEXT_MAJOR: 'all'
  # Dependencies of e-računi for Commerce and its tests without a Drupal 12
  # release yet, so the next major jobs can install them. Commerce submodules
  # are packages of their own here.
  _LENIENT_ALLOW_LIST: 'address,commerce,commerce_number_pattern,commerce_order,commerce_payment,commerce_price,commerce_product,commerce_store,entity,entity_reference_revisions,inline_entity_form,profile,state_machine,token'
  # Drupal 11 jobs default to its minimum PHP, 8.3; this module needs 8.4.
  _TARGET_PHP: '8.4'
  # Kernel tests run in separate processes; run test classes in parallel.
  _PHPUNIT_CONCURRENT: 1
  # No JavaScript or CSS to lint.
  SKIP_ESLINT: 1
  SKIP_STYLELINT: 1
